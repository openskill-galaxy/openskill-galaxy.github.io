<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenSkill Galaxy — 开放技能星河，模块化技能学习与路径导航。" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://openskill-galaxy.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenSkill Galaxy" />
    <meta property="og:description" content="开放技能星河 — 60+ 模块化技能学习站点与通关路径导航。" />
    <meta property="og:url" content="https://openskill-galaxy.github.io/" />
    <meta property="og:image" content="https://openskill-galaxy.github.io/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <title>OpenSkill Galaxy</title>
    <script>
      // Restore deep links redirected by 404.html (?page=path) before the app mounts
      (function () {
        try {
          var l = window.location;
          var q = new URLSearchParams(l.search);
          var page = q.get("page");
          if (page !== null) {
            q.delete("page");
            var rest = q.toString().replace(/~and~/g, "&");
            var path = "/" + page.replace(/~and~/g, "&").replace(/^\/+/, "");
            history.replaceState(null, "", path + (rest ? "?" + rest : "") + l.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Set theme before paint to avoid flash (light default)
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.classList.add(t === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <script>
      function showUpdateToast() {
        // 挂载后 CSS 变量已可用，直接复用设计令牌，避免硬编码色值
        const toast = document.createElement('div');
        toast.className = 'update-toast';
        toast.innerHTML = `
          <div style="background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border-strong); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; max-width: 340px; font-family: Inter, system-ui, sans-serif;">
            <span style="font-size: 16px; color: var(--accent-text);">✦</span>
            <div style="flex: 1;">
              <h4 style="margin: 0; color: var(--text); font-size: 13px; font-weight: 600;">星河图谱内容升级</h4>
              <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 12px; line-height: 1.4;">新课程与题库内容已准备就绪，立即重载体验最新版本。</p>
            </div>
            <button onclick="window.location.reload()" style="background: var(--accent); color: var(--accent-fg); border: 0; padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-accent); font-family: inherit;">重载</button>
            <button onclick="this.closest('.update-toast').remove()" aria-label="关闭" style="background: transparent; color: var(--text-subtle); border: 0; padding: 8px; border-radius: 8px; font-size: 13px; line-height: 1; cursor: pointer; font-family: inherit;">✕</button>
          </div>
        `;
        toast.style.position = 'fixed';
        toast.style.bottom = '24px';
        toast.style.right = '24px';
        toast.style.zIndex = '99999';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '1';
          toast.style.transform = 'translateY(0)';
        }, 100);
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      showUpdateToast();
                    }
                  }
                };
              }
            };
          }).catch(err => {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
